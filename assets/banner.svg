<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#060b14"/>
<stop offset="55%" stop-color="#0a1220"/>
<stop offset="100%" stop-color="#081018"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>
<radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#22c55e" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
</radialGradient>
<linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#e5faf5"/>
<stop offset="100%" stop-color="#7ee8d5"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0f1c2b" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#0a1420" stop-opacity="0.4"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

<!-- subtle grid -->
<g stroke="#173245" stroke-width="1" opacity="0.35">
<line x1="0" y1="60" x2="1200" y2="60"/>
<line x1="0" y1="120" x2="1200" y2="120"/>
<line x1="0" y1="180" x2="1200" y2="180"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="300" x2="1200" y2="300"/>
<line x1="150" y1="0" x2="150" y2="360"/>
<line x1="350" y1="0" x2="350" y2="360"/>
<line x1="550" y1="0" x2="550" y2="360"/>
<line x1="750" y1="0" x2="750" y2="360"/>
<line x1="950" y1="0" x2="950" y2="360"/>
<line x1="1150" y1="0" x2="1150" y2="360"/>
</g>

<circle cx="900" cy="180" r="240" fill="url(#glow)"/>

<!-- network graph decoration right side -->
<g opacity="0.9">
<line x1="760" y1="120" x2="880" y2="90" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
<line x1="880" y1="90" x2="1010" y2="130" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
<line x1="1010" y1="130" x2="1080" y2="220" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
<line x1="880" y1="90" x2="950" y2="200" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
<line x1="760" y1="120" x2="820" y2="230" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
<line x1="820" y1="230" x2="950" y2="200" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
<line x1="950" y1="200" x2="1080" y2="220" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
<line x1="820" y1="230" x2="900" y2="290" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
<line x1="900" y1="290" x2="1050" y2="280" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>

<circle cx="760" cy="120" r="5" fill="#7ee8d5"/>
<circle cx="880" cy="90" r="5" fill="#7ee8d5"/>
<circle cx="1010" cy="130" r="5" fill="#7ee8d5"/>
<circle cx="950" cy="200" r="5" fill="#7ee8d5"/>
<circle cx="820" cy="230" r="5" fill="#7ee8d5"/>
<circle cx="1080" cy="220" r="5" fill="#7ee8d5"/>
<circle cx="900" cy="290" r="5" fill="#7ee8d5"/>
<circle cx="1050" cy="280" r="5" fill="#7ee8d5"/>
</g>

<!-- pulsing location pin -->
<circle cx="950" cy="200" r="55" fill="url(#pinGlow)"/>
<path d="M950 165 C965 165 977 177 977 192 C977 210 950 235 950 235 C950 235 923 210 923 192 C923 177 935 165 950 165 Z" fill="#0a1420" stroke="#22c55e" stroke-width="2.5"/>
<circle cx="950" cy="192" r="9" fill="#22c55e"/>

<!-- coordinate readout style small tags -->
<g font-family="'Segoe UI', Arial, sans-serif" fill="#7ee8d5" opacity="0.75">
<text x="1005" y="245" font-size="13">192.168.x.x</text>
<text x="795" y="255" font-size="13">geo: --</text>
</g>

<!-- headline card backdrop -->
<rect x="40" y="80" width="640" height="200" fill="url(#cardGrad)" opacity="0.0"/>

<!-- headline -->
<text x="60" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="700" fill="url(#txtGrad)" textLength="480" lengthAdjust="spacingAndGlyphs">IP Grabber</text>

<!-- decorative underline accent -->
<line x1="62" y1="188" x2="330" y2="188" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
<circle cx="330" cy="188" r="5" fill="#22c55e"/>

<!-- tagline -->
<text x="60" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#b9d8ce" textLength="700" lengthAdjust="spacingAndGlyphs">Captures visitor IP addresses and metadata for devs</text>
<text x="60" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#b9d8ce" textLength="560" lengthAdjust="spacingAndGlyphs">who need lightweight tracking links.</text>

<!-- small terminal style tag -->
<g font-family="'Segoe UI', Arial, sans-serif" fill="#2dd4bf" opacity="0.8">
<text x="62" y="300" font-size="16">&gt; curl -s track.example.com/x7Qz --resolve</text>
</g>

</svg>